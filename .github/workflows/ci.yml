name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Skip redundant runs on main when only docs/tooling changed.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"

# Least privilege: the CI job only needs to read repository contents.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. new pushes to an open PR),
# but never cancel in-progress runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.26"
          # Enables module download + build caching keyed on go.sum.
          cache: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Single source of truth: the same `just verify` gate runs locally
      # (pre-push hook) and here. The recipe chains
      # fmt-check -> vet -> build -> unit (-race) -> integration.
      - name: Verify (just verify)
        run: just verify

  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    # Bound any hang: the integration step downloads a full VS Code build from
    # the update CDN at runtime, so a flaky/slow download must not run to the
    # 6-hour GitHub default.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.26"
          cache: true

      # The extension's launch (integration) test spawns the real server
      # binary; build it into the runner temp dir and hand its path to the
      # test via NATURAL_LSP_SERVER_PATH.
      - name: Build server binary
        run: go build -o "$RUNNER_TEMP/natural-lsp" ./cmd/natural-lsp

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Compile (tsc typecheck)
        working-directory: editors/vscode
        run: npm run compile

      - name: Lint (eslint)
        working-directory: editors/vscode
        run: npm run lint

      - name: Unit tests (Mocha)
        working-directory: editors/vscode
        run: npm run test:unit

      # @vscode/test-electron launches a real VS Code (Electron) instance,
      # which needs a display on Linux; xvfb is preinstalled on ubuntu-latest.
      - name: Integration tests (@vscode/test-electron)
        working-directory: editors/vscode
        run: xvfb-run -a npm test
        env:
          NATURAL_LSP_SERVER_PATH: ${{ runner.temp }}/natural-lsp
