name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        type: boolean
        default: false

# Least privilege: this release workflow legitimately needs write to create
# the git tag and GitHub Release. Nothing else is granted.
permissions:
  contents: write

# Serialize releases so two cannot run at once. Never cancel an in-flight
# release — a half-published tag/release is worse than waiting.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # NOTE: do NOT set a job-level CGO_ENABLED=0 here. `just release` runs the
    # full `verify` gate, whose `test` recipe uses `go test -race`, and the race
    # detector requires cgo. The cross-compiled release binaries are kept static
    # by the per-build `CGO_ENABLED=0 go build ...` in the `release` recipe
    # itself, so the shipped artifacts are unaffected by leaving cgo enabled here.
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected format like v1.2.3 (optionally with a -prerelease/.build suffix)."
            exit 1
          fi
          echo "Version '$VERSION' is valid."

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Ensure tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi
          echo "Tag '$VERSION' is available."

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.26"
          cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build release artifacts
        run: just release "${{ inputs.version }}"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Package VS Code extension (.vsix)
        working-directory: editors/vscode
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Pin the packaged extension version to the release tag (minus the
          # leading "v") so the .vsix version always matches the release, with no
          # separate package.json bump to remember. --allow-same-version keeps it
          # idempotent when package.json already matches; --no-git-tag-version so
          # nothing is committed (CI-only mutation).
          npm ci
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npm run compile   # vsce does not compile the sources; build out/ first
          npm run package   # produces natural-lsp-vscode-<version>.vsix
          ls -1 ./*.vsix

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=""
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${{ inputs.version }}" \
            dist/natural-lsp-* dist/checksums.txt editors/vscode/*.vsix \
            --title "${{ inputs.version }}" \
            --generate-notes \
            $prerelease_flag
