name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        type: boolean
        default: false

# Least privilege: this release workflow legitimately needs write to create
# the git tag and GitHub Release. Nothing else is granted.
permissions:
  contents: write

# Serialize releases so two cannot run at once. Never cancel an in-flight
# release — a half-published tag/release is worse than waiting.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # NOTE: do NOT set a job-level CGO_ENABLED=0 here. `just release` runs the
    # full `verify` gate, whose `test` recipe uses `go test -race`, and the race
    # detector requires cgo. The cross-compiled release binaries are kept static
    # by the per-build `CGO_ENABLED=0 go build ...` in the `release` recipe
    # itself, so the shipped artifacts are unaffected by leaving cgo enabled here.
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected format like v1.2.3 (optionally with a -prerelease/.build suffix)."
            exit 1
          fi
          echo "Version '$VERSION' is valid."

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Ensure tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi
          echo "Tag '$VERSION' is available."

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.26"
          cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build release artifacts
        run: just release "${{ inputs.version }}"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Package & verify platform-specific .vsix (bundled server)
        working-directory: editors/vscode
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"

          npm ci
          # Pin the .vsix version to the release tag (idempotent; CI-only, not
          # committed). vsce compiles nothing, so build out/ first, once.
          npm version "$ver" --no-git-tag-version --allow-same-version
          npm run compile

          # Build one platform-specific .vsix per target, each embedding ONLY that
          # platform's server binary from dist/ (produced by `just release`). The
          # extension resolves <extensionPath>/bin/natural-lsp[.exe] at activation
          # (feature 37). Fields per entry: <vsce-target> <dist-binary> <bundled-name>.
          # bundled-name is natural-lsp.exe for win32 (process.platform === 'win32'),
          # else natural-lsp — matching serverPath.ts's bundledServerPath().
          for entry in \
            "linux-x64    natural-lsp-linux-amd64        natural-lsp" \
            "linux-arm64  natural-lsp-linux-arm64        natural-lsp" \
            "darwin-x64   natural-lsp-darwin-amd64       natural-lsp" \
            "darwin-arm64 natural-lsp-darwin-arm64       natural-lsp" \
            "win32-x64    natural-lsp-windows-amd64.exe  natural-lsp.exe"; do
            set -- $entry
            target="$1"; distbin="$2"; binname="$3"

            rm -rf bin && mkdir -p bin
            cp "../../dist/${distbin}" "bin/${binname}"
            chmod +x "bin/${binname}" || true   # exec bit may not survive .vsix; extension re-chmods on activation

            out="natural-lsp-vscode-${ver}-${target}.vsix"
            npx vsce package --target "$target" --out "$out"

            # Fail the release if a .vsix is missing the bundled server binary or
            # the vscode-languageclient runtime dependency (PR #60) — never ship a
            # .vsix that crashes on activation.
            if ! unzip -l "$out" | grep -q "extension/bin/${binname}"; then
              echo "::error::$out is missing the bundled server binary (extension/bin/${binname})."
              exit 1
            fi
            if ! unzip -l "$out" | grep -q 'extension/node_modules/vscode-languageclient/'; then
              echo "::error::$out is missing the vscode-languageclient runtime dependency (check editors/vscode/.vscodeignore)."
              exit 1
            fi
            echo "Verified $out: bundles ${binname} + vscode-languageclient."
          done
          rm -rf bin
          echo "Built platform-specific .vsix files:"; ls -1 ./*.vsix

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=""
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${{ inputs.version }}" \
            dist/natural-lsp-* dist/checksums.txt editors/vscode/*.vsix \
            --title "${{ inputs.version }}" \
            --generate-notes \
            $prerelease_flag
